name: Build GtInstall.jar

on:
  push:
    branches: [main]
    paths:
      - 'GtInstall.java'
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download android.jar
        run: |
          # محاولة تحميل android.jar من عدة مصادر
          wget -q --timeout=30 https://github.com/Sable/android-platforms/raw/master/android-33/android.jar -O android.jar || \
          wget -q --timeout=30 https://github.com/Sable/android-platforms/raw/master/android-32/android.jar -O android.jar || \
          wget -q --timeout=30 https://github.com/Sable/android-platforms/raw/master/android-31/android.jar -O android.jar || \
          wget -q --timeout=30 https://github.com/AndroidSDKSources/android-sdk-sources-for-api-level-31/raw/master/android.jar -O android.jar || \
          echo "All URLs failed" && exit 1
          
          ls -lh android.jar
          file android.jar

      - name: Compile GtInstall.java
        run: |
          mkdir -p build/com/garagetool/installer
          javac -source 8 -target 8 -cp android.jar -d build GtInstall.java
          find build -type f

      - name: Package into g.jar
        run: |
          cd build
          jar cf ../g.jar com/garagetool/installer/GtInstall.class
          cd ..
          ls -lh g.jar
          unzip -l g.jar

      - name: Copy to public/tools/
        run: |
          mkdir -p public/tools
          cp g.jar public/tools/g.jar
          ls -lh public/tools/g.jar

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tools/g.jar
          git diff --quiet && git diff --staged --quiet || git commit -m "Build: auto-compile g.jar [skip ci]"
          git push
