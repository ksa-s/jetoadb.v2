name: Build GtInstall.jar

on:
  push:
    branches: [main]
    paths:
      - 'GtInstall.java'
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Download android.jar
        run: |
          wget -q --timeout=60 https://raw.githubusercontent.com/Sable/android-platforms/master/android-30/android.jar -O android.jar
          ls -lh android.jar

      - name: Download R8 (contains d8)
        run: |
          wget -q https://repo1.maven.org/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar -O r8.jar
          ls -lh r8.jar

      - name: Compile GtInstall.java
        run: |
          mkdir -p build
          javac -source 8 -target 8 -cp android.jar -d build GtInstall.java
          echo "=== Compiled classes ==="
          find build -type f

      - name: Convert to DEX (d8)
        run: |
          mkdir -p dex-out
          java -cp r8.jar com.android.tools.r8.D8 \
            --lib android.jar \
            --min-api 21 \
            --output dex-out/ \
            $(find build -name "*.class")
          echo "=== DEX output ==="
          ls -la dex-out/

      - name: Package g.jar with classes.dex
        run: |
          cd dex-out
          jar cf ../g.jar classes.dex
          cd ..
          echo "=== g.jar contents ==="
          ls -lh g.jar
          unzip -l g.jar

      - name: Copy to public/tools/
        run: |
          mkdir -p public/tools
          cp g.jar public/tools/g.jar
          ls -lh public/tools/g.jar

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tools/g.jar
          git diff --quiet && git diff --staged --quiet || git commit -m "Build: DEX-format g.jar [skip ci]"
          git push
