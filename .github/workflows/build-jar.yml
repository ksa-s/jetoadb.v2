name: Build GtInstall.jar

on:
  push:
    branches: [main]
    paths:
      - 'GtInstall.java'
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

       - name: Download android.jar
        run: |
          # نحفظ android.jar في /tmp (خارج المستودع)
          wget -q --timeout=60 https://raw.githubusercontent.com/Sable/android-platforms/master/android-30/android.jar -O /tmp/android.jar || \
          wget -q --timeout=60 https://github.com/Sable/android-platforms/raw/master/android-30/android.jar -O /tmp/android.jar
          
          # التحقق من صحة الملف
          if [ ! -s /tmp/android.jar ] || [ $(stat -c%s /tmp/android.jar) -lt 1000000 ]; then
            echo "ERROR: android.jar is invalid!"
            exit 1
          fi
          
          echo "=== android.jar ready ==="
          ls -lh /tmp/android.jar
          file /tmp/android.jar

            - name: Compile GtInstall.java
        run: |
          mkdir -p build/com/garagetool/installer
          javac -source 8 -target 8 -cp /tmp/android.jar -d build GtInstall.java
          find build -type f

      - name: Package into g.jar
        run: |
          cd build
          jar cf ../g.jar com/garagetool/installer/GtInstall.class
          cd ..
          ls -lh g.jar
          unzip -l g.jar

      - name: Copy to public/tools/
        run: |
          mkdir -p public/tools
          cp g.jar public/tools/g.jar
          ls -lh public/tools/g.jar

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tools/g.jar
          git diff --quiet && git diff --staged --quiet || git commit -m "Build: auto-compile g.jar [skip ci]"
          git push
