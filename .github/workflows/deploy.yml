name: Build & Deploy (Source Hidden)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# لا صلاحيات قراءة المحتوى للـ public — فقط الكتابة لـ Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
         bun install
         bun add -D terser

      - name: Verify g.jar
        run: |
          if [ ! -f public/tools/g.jar ]; then
            echo "⚠️  g.jar not found, creating placeholder..."
            mkdir -p public/tools
            echo "placeholder" > public/tools/g.jar
          fi

      - name: Build (minified + obfuscated)
        run: bun run build

      - name: Remove source maps (extra security)
        run: find dist -name "*.map" -delete 2>/dev/null || true

      # ─── نشر dist/ فقط إلى branch منفصل (gh-pages) ───
      # الكود المصدري يبقى في main ولا يُنشر أبداً
      - name: Deploy dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false
          # لا ملفات مصدر — فقط الـ dist المبني والمضغوط
          exclude_assets: ''
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: built output only [skip ci]'
