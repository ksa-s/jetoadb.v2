name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify g.jar exists
        run: |
          if [ ! -f public/tools/g.jar ]; then
            echo "⚠️ g.jar not found, creating placeholder..."
            mkdir -p public/tools
            echo "placeholder" > public/tools/g.jar
          fi
          ls -lh public/tools/g.jar

      - name: Build
        run: bun run build

      - name: Verify build
        run: |
          echo "=== dist contents ==="
          ls -lh dist/
          ls -lh dist/tools/ || echo "tools/ not found"
          echo "=== dist/index.html ==="
          cat dist/index.html | head -20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
